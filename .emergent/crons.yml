crons:
  - name: alarm-scan
    description: "Probes every managed router and pushes CPU, interface-down and unreachable alarms to role Telegram"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/alarm-scan"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: monitor-scan
    description: "Pings every device and polls SNMP v2c (interfaces + CPU), then trims monitoring history older than 30 days"
    cron: "* * * * *"
    endpoint: "{{BASE_URL}}/api/cron/monitor-scan"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: backup-scan
    description: "Runs due scheduled .rsc router backups and stores them in object storage"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/backup-scan"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
